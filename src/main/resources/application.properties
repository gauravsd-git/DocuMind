spring.application.name=documind

spring.datasource.url=jdbc:postgresql://localhost:5432/documind
spring.datasource.username=documind
spring.datasource.password=documind

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ============================================================
# Multipart
# ============================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB


# ============================================================
# Gemini
# ============================================================

spring.ai.google.genai.api-key=${GEMINI_API_KEY}

spring.ai.google.genai.chat.model=gemini-3.6-flash

spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}


# ============================================================
# JWT
# ============================================================

jwt.secret=DocuMindSuperSecretKeyForJwtAuthentication2026VerySecure

jwt.expiration=86400000